# E8g: relay on the complement ring with chord 2-5 (E5d), retell always,
# damped on agreement, retell_on_objection = true. Budget 200 per round.
base = "e5d_ring_chord.toml"
name = "e8g_relay_chord_controversy"

[scheduler]
class = "smallworld.impl.schedulers.Flood"
params = { sources = [0], mode = "queue", retell = "always", stop_on = "agreement", retell_on_objection = true, budget = 200 }
